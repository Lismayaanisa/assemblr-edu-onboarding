<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 106" role="img" aria-label="blr peeking">
  <style>
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
    .ant{transform-origin:80px 34px;animation:bob 3s ease-in-out infinite}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
    @keyframes bob{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5A6BDD"/><stop offset="1" stop-color="#2F3D99"/></linearGradient>
    <clipPath id="c"><rect width="160" height="98"/></clipPath>
  </defs>
  <g class="ant"><path d="M80 34V20" stroke="#2F3D99" stroke-width="4" stroke-linecap="round"/><circle cx="80" cy="15" r="7" fill="#E8AE1A"/><circle cx="77.5" cy="12.5" r="2" fill="#fff" opacity=".7"/></g>
  <g clip-path="url(#c)">
    <rect x="30" y="34" width="100" height="100" rx="32" fill="url(#b)"/>
    <ellipse cx="70" cy="45" rx="26" ry="5" fill="#fff" opacity=".18"/>
    <rect x="42" y="56" width="76" height="40" rx="18" fill="#1B245E"/>
    <rect x="49" y="61" width="20" height="5" rx="2.5" fill="#fff" opacity=".14"/>
    <rect class="eye" x="58" y="68" width="11" height="16" rx="5.5" fill="#8BE3FF"/>
    <rect class="eye" x="91" y="68" width="11" height="16" rx="5.5" fill="#8BE3FF"/>
  </g>
  <rect x="36" y="90" width="26" height="16" rx="8" fill="#4A5BD0"/>
  <rect x="98" y="90" width="26" height="16" rx="8" fill="#4A5BD0"/>
</svg>
