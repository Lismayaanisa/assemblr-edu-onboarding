<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 170" role="img" aria-label="blr waving">
  <style>
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
    .arm{transform-origin:128px 92px;animation:wave 2.4s cubic-bezier(.22,1,.36,1) infinite}
    .ant{transform-origin:80px 34px;animation:bob 3.2s ease-in-out infinite}
    @keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
    @keyframes wave{0%,55%,100%{transform:rotate(0)}10%{transform:rotate(18deg)}22%{transform:rotate(-8deg)}34%{transform:rotate(16deg)}46%{transform:rotate(-4deg)}}
    @keyframes bob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5A6BDD"/><stop offset="1" stop-color="#2F3D99"/></linearGradient>
  </defs>
  <ellipse cx="80" cy="160" rx="38" ry="6" fill="#2F3D99" opacity=".12"/>
  <g class="ant"><path d="M80 34V20" stroke="#2F3D99" stroke-width="4" stroke-linecap="round"/><circle cx="80" cy="15" r="7" fill="#E8AE1A"/><circle cx="77.5" cy="12.5" r="2" fill="#fff" opacity=".7"/></g>
  <path d="M32 96Q18 110 23 124" stroke="#3F4FC4" stroke-width="10" stroke-linecap="round" fill="none"/>
  <rect x="50" y="128" width="22" height="16" rx="8" fill="#26317F"/>
  <rect x="88" y="128" width="22" height="16" rx="8" fill="#26317F"/>
  <rect x="30" y="34" width="100" height="100" rx="32" fill="url(#b)"/>
  <ellipse cx="70" cy="45" rx="26" ry="5" fill="#fff" opacity=".18"/>
  <rect x="42" y="58" width="76" height="46" rx="20" fill="#1B245E"/>
  <rect x="49" y="63" width="20" height="5" rx="2.5" fill="#fff" opacity=".14"/>
  <rect class="eye" x="58" y="70" width="11" height="16" rx="5.5" fill="#8BE3FF"/>
  <rect class="eye" x="91" y="70" width="11" height="16" rx="5.5" fill="#8BE3FF"/>
  <path d="M72 92Q80 98 88 92" stroke="#8BE3FF" stroke-width="3" stroke-linecap="round" fill="none"/>
  <ellipse cx="46" cy="114" rx="7" ry="4.5" fill="#E21B72" opacity=".5"/>
  <ellipse cx="114" cy="114" rx="7" ry="4.5" fill="#E21B72" opacity=".5"/>
  <circle cx="72" cy="122" r="3" fill="#E21B72"/><circle cx="80" cy="122" r="3" fill="#12A9E6"/><circle cx="88" cy="122" r="3" fill="#E8AE1A"/>
  <g class="arm"><path d="M128 92Q146 78 144 56" stroke="#3F4FC4" stroke-width="10" stroke-linecap="round" fill="none"/><circle cx="144" cy="52" r="8" fill="#4A5BD0"/></g>
</svg>
